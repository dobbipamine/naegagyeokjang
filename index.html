<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#ffffff'><meta http-equiv='Cache-Control' content='no-cache, no-store, must-revalidate'><meta http-equiv='Pragma' content='no-cache'><meta http-equiv='Expires' content='0'><link rel='manifest' href='manifest.json?v=2.1'><title>내가격장</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#171717;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}header{position:sticky;top:0;background:#fff;padding:18px 16px 12px;border-bottom:1px solid #eee;z-index:2}h1{font-size:22px;margin:0}.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.versionBtn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:#555;white-space:nowrap}.search{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:14px;font-size:16px}main{max-width:720px;margin:auto;padding:14px 14px 100px}.sectionTitle{font-size:13px;color:#666;margin:13px 2px 7px;display:flex;justify-content:space-between;align-items:center}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.chip{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap}.chip.active{border-color:#111;background:#111;color:white}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0000000b}.row{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:12px;background:#eee;object-fit:cover}.grow{flex:1;min-width:0}.muted{color:#777;font-size:13px}.price{font-size:20px;font-weight:750}.unit{font-size:13px;margin-top:3px}.fab{position:fixed;right:20px;bottom:22px;border:0;border-radius:18px;background:#111;color:#fff;padding:15px 18px;font-size:16px;box-shadow:0 5px 20px #0003}dialog{border:0;border-radius:22px;width:min(94vw,560px);padding:0;max-height:92vh}dialog::backdrop{background:#0006}.form{padding:18px;max-height:92vh;overflow:auto}.form h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:13px;margin:0 0 5px;color:#555}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#b42318}.empty{text-align:center;padding:60px 20px;color:#777}.stats{display:flex;gap:8px;overflow:auto}.stat{min-width:140px}.stat b{display:block;font-size:18px;margin-top:4px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.linkbtn{border:0;background:transparent;text-decoration:underline;color:#555;padding:6px}.photoPreview{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px;display:none}.itemTitle{font-size:16px;font-weight:750;margin-bottom:3px}.product{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manageList{display:flex;flex-direction:column;gap:8px;margin-top:12px}.manageRow{display:flex;gap:8px;align-items:center}.manageRow input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px}.hint{font-size:12px;color:#777;margin-top:5px}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div class='headrow'><h1>내가격장</h1><button id='updateBtn' class='versionBtn' type='button'>v2.1 · 업데이트 확인</button></div><input id='search' class='search' placeholder='품목, 상품명, 구매처 검색'></header><main>
<div class='sectionTitle'><span>카테고리</span><button class='linkbtn' id='manageCatsBtn'>관리</button></div><div class='toolbar' id='cats'></div>
<div class='sectionTitle' id='itemTitleRow'><span>품목</span></div><div class='toolbar' id='items'></div>
<section class='stats' id='stats'></section><div id='list'></div></main><button class='fab' id='addBtn'>＋ 가격 기록</button>
<dialog id='dlg'><form class='form' id='form'><div class='topline'><h2 id='formTitle'>가격 기록</h2><button type='button' class='linkbtn' id='closeBtn'>닫기</button></div><div class='grid'>
<div class='field'><label>카테고리 *</label><select id='category' required></select></div>
<div class='field'><label>품목 *</label><input id='item' required placeholder='예: 계란'><div class='hint'>같은 종류의 가격을 묶는 이름이에요.</div></div>
<div class='field wide'><label>상품명 *</label><input id='name' required placeholder='예: 동물복지 유정란 30구'></div>
<div class='field'><label>구매처</label><input id='store' placeholder='예: 이마트'></div>
<div class='field'><label>가격(원) *</label><input id='price' type='number' min='0' required></div>
<div class='field'><label>구매일</label><input id='date' type='date'></div>
<div class='field'><label>용량/수량</label><input id='amount' type='number' min='0' step='0.01' placeholder='예: 30'></div>
<div class='field'><label>단위</label><select id='unit'><option value='g'>g</option><option value='kg'>kg</option><option value='mL'>mL</option><option value='L'>L</option><option value='개'>개</option><option value='구'>구</option><option value='팩'>팩</option><option value='봉'>봉</option></select></div>
<div class='field'><label>구매 방식</label><select id='channel'><option>오프라인</option><option>온라인</option></select></div>
<div class='field wide'><label>사진</label><input id='photo' type='file' accept='image/*' capture='environment'><img id='photoPreview' class='photoPreview'><button type='button' class='linkbtn' id='removePhotoBtn' style='display:none'>사진 제거</button></div>
<div class='field wide'><label>메모</label><textarea id='memo' rows='2' placeholder='행사상품, 카드할인 등'></textarea></div></div><div class='actions'><button type='button' class='btn' id='backupBtn'>백업</button><label class='btn'>복원<input id='restore' type='file' accept='application/json' hidden></label><button class='btn primary' id='saveBtn'>저장</button></div></form></dialog>
<dialog id='catDlg'><div class='form'><div class='topline'><h2>카테고리 관리</h2><button type='button' class='linkbtn' id='closeCatBtn'>닫기</button></div><div class='manageRow'><input id='newCat' placeholder='새 카테고리 이름'><button class='btn primary' id='addCatBtn'>추가</button></div><div class='manageList' id='catManageList'></div><div class='hint'>기록에 사용 중인 카테고리를 삭제하면 해당 기록은 ‘기타’로 이동합니다.</div></div></dialog>
<script>
const DEFAULT_CATS=['채소·과일','육류','수산물','유제품·계란','냉장·냉동','면·가공식품','조미료·소스','음료','생활용품','기타'];
let records=JSON.parse(localStorage.getItem('priceRecords')||'[]').map(r=>({...r,item:r.item||r.name||'미분류'}));
let categories=JSON.parse(localStorage.getItem('priceCategories')||'null')||[...DEFAULT_CATS];
let activeCat='전체',activeItem='전체',editingId=null,photoData='';const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function persist(){localStorage.setItem('priceRecords',JSON.stringify(records));localStorage.setItem('priceCategories',JSON.stringify(categories));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function unitPrice(r){let a=+r.amount,p=+r.price;if(!a)return '';if(r.unit==='kg')a*=1000;if(r.unit==='L')a*=1000;if(r.unit==='g')return Math.round(p/a*100)+'원/100g';if(r.unit==='mL')return Math.round(p/a*100)+'원/100mL';if(['개','구','팩','봉'].includes(r.unit))return Math.round(p/a).toLocaleString()+'원/'+r.unit;return ''}
function filtered(){let q=$('search').value.trim().toLowerCase();return records.filter(r=>(activeCat==='전체'||r.category===activeCat)&&(activeItem==='전체'||r.item===activeItem)&&(!q||(`${r.item} ${r.name} ${r.store} ${r.category} ${r.memo||''}`).toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function render(){
 $('cats').innerHTML=['전체',...categories].map(c=>`<button class='chip ${c===activeCat?'active':''}' data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 $('cats').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;activeItem='전체';render()});
 const itemSource=records.filter(r=>activeCat==='전체'||r.category===activeCat);const itemNames=[...new Set(itemSource.map(r=>r.item).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
 $('items').innerHTML=['전체',...itemNames].map(i=>`<button class='chip ${i===activeItem?'active':''}' data-item="${esc(i)}">${esc(i)}</button>`).join('');
 $('items').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{activeItem=b.dataset.item;render()});
 let f=filtered(),prices=f.map(x=>+x.price).filter(x=>Number.isFinite(x));let label=activeItem!=='전체'?activeItem:(activeCat!=='전체'?activeCat:'전체 기록');
 $('stats').innerHTML=`<div class='card stat'><span class='muted'>${esc(label)} 기록</span><b>${f.length}건</b></div><div class='card stat'><span class='muted'>${activeItem!=='전체'?'품목 최저가':'선택 범위 최저가'}</span><b>${prices.length?Math.min(...prices).toLocaleString()+'원':'-'}</b></div>`;
 $('list').innerHTML=f.length?f.map(r=>`<article class='card'><div class='row'>${r.photo?`<img class='thumb' src='${r.photo}'>`:`<div class='thumb'></div>`}<div class='grow'><div class='muted'>${esc(r.category||'미분류')} · ${esc(r.date||'')}</div><div class='itemTitle'>${esc(r.item||'미분류')}</div><div class='product'>${esc(r.name)}</div><div class='price'>${(+r.price).toLocaleString()}원</div><div class='unit'>${r.amount?`${esc(r.amount)}${esc(r.unit)} · `:''}${esc(unitPrice(r))}</div><div class='muted'>${esc(r.store||'구매처 미입력')} · ${esc(r.channel||'')}${r.memo?' · '+esc(r.memo):''}</div></div><div><button class='linkbtn' data-edit='${r.id}'>수정</button><button class='linkbtn danger' data-del='${r.id}'>삭제</button></div></div></article>`).join(''):`<div class='empty'>조건에 맞는 가격 기록이 없어요.<br>‘＋ 가격 기록’을 눌러 기록해보세요.</div>`;
 $('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));$('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));renderCategorySelect();
}
function renderCategorySelect(){let cur=$('category').value;$('category').innerHTML=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(categories.includes(cur))$('category').value=cur}
function resetForm(){editingId=null;photoData='';$('form').reset();$('date').value=today();renderCategorySelect();$('formTitle').textContent='가격 기록';$('photoPreview').style.display='none';$('removePhotoBtn').style.display='none'}
function openAdd(){resetForm();$('dlg').showModal()}
function openEdit(id){let r=records.find(x=>x.id===id);if(!r)return;editingId=id;renderCategorySelect();$('category').value=r.category||'기타';$('item').value=r.item||'';$('name').value=r.name||'';$('store').value=r.store||'';$('price').value=r.price??'';$('date').value=r.date||today();$('amount').value=r.amount??'';$('unit').value=r.unit||'개';$('channel').value=r.channel||'오프라인';$('memo').value=r.memo||'';photoData=r.photo||'';$('photoPreview').src=photoData;$('photoPreview').style.display=photoData?'block':'none';$('removePhotoBtn').style.display=photoData?'inline-block':'none';$('formTitle').textContent='가격 기록 수정';$('dlg').showModal()}
function del(id){if(confirm('이 기록을 삭제할까요?')){records=records.filter(x=>x.id!==id);persist()}}
$('search').addEventListener('input',render);$('addBtn').onclick=openAdd;$('closeBtn').onclick=()=>$('dlg').close();
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{photoData=rd.result;$('photoPreview').src=photoData;$('photoPreview').style.display='block';$('removePhotoBtn').style.display='inline-block'};rd.readAsDataURL(f)};
$('removePhotoBtn').onclick=()=>{photoData='';$('photo').value='';$('photoPreview').style.display='none';$('removePhotoBtn').style.display='none'};
$('form').onsubmit=e=>{e.preventDefault();let data={id:editingId||crypto.randomUUID(),category:$('category').value,item:$('item').value.trim(),name:$('name').value.trim(),store:$('store').value.trim(),price:+$('price').value,date:$('date').value,amount:+$('amount').value||'',unit:$('unit').value,channel:$('channel').value,memo:$('memo').value.trim(),photo:photoData};if(editingId){records=records.map(r=>r.id===editingId?data:r)}else records.push(data);persist();$('dlg').close();resetForm()};
$('backupBtn').onclick=()=>{let payload={version:2,categories,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='내가격장_백업.json';a.click();URL.revokeObjectURL(a.href)};
$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(Array.isArray(d)){records=d.map(r=>({...r,item:r.item||r.name||'미분류'}))}else if(d&&Array.isArray(d.records)){records=d.records.map(r=>({...r,item:r.item||r.name||'미분류'}));if(Array.isArray(d.categories)&&d.categories.length)categories=d.categories}else throw 0;persist();alert('복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}};rd.readAsText(f)};
function renderCatManage(){ $('catManageList').innerHTML=categories.map(c=>`<div class='manageRow'><input value="${esc(c)}" data-catname="${esc(c)}"><button class='btn' data-rename="${esc(c)}">변경</button><button class='btn danger' data-rmcat="${esc(c)}">삭제</button></div>`).join('');$('catManageList').querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let old=b.dataset.rename,row=b.closest('.manageRow'),next=row.querySelector('input').value.trim();if(!next||next===old)return;if(categories.includes(next)){alert('이미 있는 카테고리입니다.');return}categories=categories.map(c=>c===old?next:c);records=records.map(r=>r.category===old?{...r,category:next}:r);if(activeCat===old)activeCat=next;persist();renderCatManage()});$('catManageList').querySelectorAll('[data-rmcat]').forEach(b=>b.onclick=()=>{let c=b.dataset.rmcat;if(c==='기타'){alert('기타 카테고리는 삭제할 수 없습니다.');return}if(confirm(`‘${c}’ 카테고리를 삭제할까요?\n해당 기록은 ‘기타’로 이동합니다.`)){categories=categories.filter(x=>x!==c);records=records.map(r=>r.category===c?{...r,category:'기타'}:r);if(activeCat===c)activeCat='전체';persist();renderCatManage()}})}
$('manageCatsBtn').onclick=()=>{renderCatManage();$('catDlg').showModal()};$('closeCatBtn').onclick=()=>$('catDlg').close();$('addCatBtn').onclick=()=>{let c=$('newCat').value.trim();if(!c)return;if(categories.includes(c)){alert('이미 있는 카테고리입니다.');return}categories.push(c);$('newCat').value='';persist();renderCatManage()};

const APP_VERSION='2.1';let swReg=null;
async function registerSW(){if(!('serviceWorker' in navigator))return;try{swReg=await navigator.serviceWorker.register('./sw-v2.1.js',{scope:'./',updateViaCache:'none'});await swReg.update();navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('swReloaded')==='1')return;sessionStorage.setItem('swReloaded','1');location.reload()});}catch(err){console.warn('서비스워커 등록 실패',err)}}
$('updateBtn').onclick=async()=>{let b=$('updateBtn');b.textContent='업데이트 확인 중…';try{if(swReg)await swReg.update();let res=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});let v=res.ok?(await res.json()).version:APP_VERSION;if(v!==APP_VERSION){b.textContent='새 버전 '+v+' 있음';alert('새 버전 '+v+'이 있습니다. 페이지를 다시 열면 적용됩니다.')}else{b.textContent='v'+APP_VERSION+' · 최신';setTimeout(()=>b.textContent='v'+APP_VERSION+' · 업데이트 확인',1800)}}catch(e){b.textContent='v'+APP_VERSION+' · 오프라인';setTimeout(()=>b.textContent='v'+APP_VERSION+' · 업데이트 확인',1800)}};
registerSW();$('date').value=today();persist();
</script></body></html>
