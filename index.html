<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json?v=3.0">
<title>내가격장</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#171717;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#fff;padding:14px 16px 10px;border-bottom:1px solid #eee;z-index:4}h1{font-size:22px;margin:0}.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.versionBtn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:#555;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #ddd;background:#fff;border-radius:12px;padding:9px 6px;font-size:13px}.tab.active{background:#111;color:#fff;border-color:#111}.search{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:14px;font-size:16px;margin-top:10px}main{max-width:760px;margin:auto;padding:14px 14px 100px}.view{display:none}.view.active{display:block}.sectionTitle{font-size:13px;color:#666;margin:13px 2px 7px;display:flex;justify-content:space-between;align-items:center;gap:10px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.chip{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap}.chip.active{border-color:#111;background:#111;color:white}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0000000b}.row{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:12px;background:#eee;object-fit:cover;flex:0 0 auto}.grow{flex:1;min-width:0}.muted{color:#777;font-size:13px}.price{font-size:20px;font-weight:750}.unit{font-size:13px;margin-top:3px}.fab{position:fixed;right:20px;bottom:22px;border:0;border-radius:18px;background:#111;color:#fff;padding:15px 18px;font-size:16px;box-shadow:0 5px 20px #0003;z-index:5}dialog{border:0;border-radius:22px;width:min(94vw,560px);padding:0;max-height:92vh}dialog::backdrop{background:#0006}.form{padding:18px;max-height:92vh;overflow:auto}.form h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:13px;margin:0 0 5px;color:#555}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#b42318}.empty{text-align:center;padding:50px 20px;color:#777}.stats{display:flex;gap:8px;overflow:auto}.stat{min-width:140px}.stat b{display:block;font-size:18px;margin-top:4px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.linkbtn{border:0;background:transparent;text-decoration:underline;color:#555;padding:6px}.photoPreview{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px;display:none}.itemTitle{font-size:16px;font-weight:750;margin-bottom:3px}.product{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manageList{display:flex;flex-direction:column;gap:8px;margin-top:12px}.manageRow{display:flex;gap:7px;align-items:center}.manageRow input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;min-width:0}.mini{padding:8px 10px;min-width:38px}.hint{font-size:12px;color:#777;margin-top:5px}.checkrow{display:flex;align-items:center;gap:8px;margin-top:8px}.checkrow input{width:auto}.monthHead{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.monthHead .field{flex:1;min-width:180px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{display:block;font-size:23px;margin-top:4px}.breakRow{padding:12px 0;border-bottom:1px solid #eee}.breakRow:last-child{border-bottom:0}.breakTop{display:flex;justify-content:space-between;gap:8px}.bar{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-top:7px}.bar>span{display:block;height:100%;background:#111;border-radius:999px}.expiryBadge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;margin-top:4px;background:#f1f1f1}.expiryBadge.urgent{background:#fff0ee;color:#b42318}.expiryBadge.soon{background:#fff7e6;color:#8a5a00}.expiryBadge.ok{background:#eef7ee;color:#2f6b35}.expiryGroup{margin-top:16px}.expiryGroup h3{font-size:15px;margin:0 0 8px}.expiryDate{font-weight:700}.noFab .fab{display:none}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.summaryGrid{grid-template-columns:1fr}.row{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="headrow"><h1>내가격장</h1><button id="updateBtn" class="versionBtn" type="button">v3.0 · 업데이트 확인</button></div>
  <div class="tabs">
    <button class="tab active" data-view="prices">가격 기록</button>
    <button class="tab" data-view="monthly">월별 통계</button>
    <button class="tab" data-view="expiry">유통기한</button>
  </div>
  <input id="search" class="search" placeholder="품목, 상품명, 구매처 검색">
</header>
<main>
<section id="view-prices" class="view active">
  <div class="sectionTitle"><span>카테고리</span><button class="linkbtn" id="manageCatsBtn">관리·순서</button></div>
  <div class="toolbar" id="cats"></div>
  <div class="sectionTitle"><span>품목</span><button class="linkbtn" id="manageItemsBtn">순서 변경</button></div>
  <div class="toolbar" id="items"></div>
  <section class="stats" id="stats"></section>
  <div id="list"></div>
</section>
<section id="view-monthly" class="view">
  <div class="monthHead">
    <div class="field"><label>조회 월</label><input id="monthPick" type="month"></div>
  </div>
  <div class="summaryGrid" id="monthSummary"></div>
  <div class="sectionTitle"><span>품목별 구매금액</span><span id="monthCount" class="muted"></span></div>
  <div class="card" id="monthBreakdown"></div>
</section>
<section id="view-expiry" class="view">
  <div class="sectionTitle"><span>유통기한 현황</span><span class="muted">기한이 있는 기록만 표시</span></div>
  <div class="summaryGrid" id="expirySummary"></div>
  <div id="expiryList"></div>
</section>
</main>
<button class="fab" id="addBtn">＋ 가격 기록</button>

<dialog id="dlg"><form class="form" id="form">
  <div class="topline"><h2 id="formTitle">가격 기록</h2><button type="button" class="linkbtn" id="closeBtn">닫기</button></div>
  <div class="grid">
    <div class="field"><label>카테고리 *</label><select id="category" required></select></div>
    <div class="field"><label>품목 *</label><input id="item" required placeholder="예: 계란"><div class="hint">같은 종류의 가격을 묶는 이름이에요.</div></div>
    <div class="field wide"><label>상품명 *</label><input id="name" required placeholder="예: 동물복지 유정란 30구"></div>
    <div class="field"><label>구매처</label><input id="store" placeholder="예: 이마트"></div>
    <div class="field"><label>가격(원) *</label><input id="price" type="number" min="0" required></div>
    <div class="field"><label>구매일</label><input id="date" type="date"></div>
    <div class="field"><label>용량/수량</label><input id="amount" type="number" min="0" step="0.01" placeholder="예: 30"></div>
    <div class="field"><label>단위</label><select id="unit"><option value="g">g</option><option value="kg">kg</option><option value="mL">mL</option><option value="L">L</option><option value="개">개</option><option value="구">구</option><option value="팩">팩</option><option value="봉">봉</option></select></div>
    <div class="field"><label>구매 방식</label><select id="channel"><option>오프라인</option><option>온라인</option></select></div>
    <div class="field"><label>유통기한</label><input id="expiryDate" type="date"></div>
    <div class="field wide"><label class="checkrow"><input id="expiryNA" type="checkbox"> 유통기한 해당없음</label><div class="hint">생활용품 등 유통기한 관리가 필요 없는 품목에 체크하세요.</div></div>
    <div class="field wide"><label>사진</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photoPreview"><button type="button" class="linkbtn" id="removePhotoBtn" style="display:none">사진 제거</button></div>
    <div class="field wide"><label>메모</label><textarea id="memo" rows="2" placeholder="행사상품, 카드할인 등"></textarea></div>
  </div>
  <div class="actions"><button type="button" class="btn" id="backupBtn">전체 백업</button><label class="btn">복원<input id="restore" type="file" accept="application/json" hidden></label><button class="btn primary" id="saveBtn">저장</button></div>
</form></dialog>

<dialog id="catDlg"><div class="form">
  <div class="topline"><h2>카테고리 관리</h2><button type="button" class="linkbtn" id="closeCatBtn">닫기</button></div>
  <div class="manageRow"><input id="newCat" placeholder="새 카테고리 이름"><button class="btn primary" id="addCatBtn">추가</button></div>
  <div class="manageList" id="catManageList"></div>
  <div class="hint">▲▼로 홈에 보이는 순서를 바꿀 수 있습니다. 사용 중인 카테고리를 삭제하면 해당 기록은 ‘기타’로 이동합니다.</div>
</div></dialog>

<dialog id="itemDlg"><div class="form">
  <div class="topline"><h2>품목 순서 변경</h2><button type="button" class="linkbtn" id="closeItemBtn">닫기</button></div>
  <div class="field"><label>카테고리</label><select id="itemOrderCat"></select></div>
  <div class="manageList" id="itemManageList"></div>
  <div class="hint">▲▼로 선택한 카테고리 안에서 품목 순서를 바꿀 수 있습니다.</div>
</div></dialog>

<script>
const APP_VERSION='3.0';
const DEFAULT_CATS=['채소·과일','육류','수산물','유제품·계란','냉장·냉동','면·가공식품','조미료·소스','음료','생활용품','기타'];
const $=id=>document.getElementById(id);
let records=JSON.parse(localStorage.getItem('priceRecords')||'[]').map(r=>({...r,item:r.item||r.name||'미분류',expiryDate:r.expiryDate||'',expiryNA:!!r.expiryNA}));
let categories=JSON.parse(localStorage.getItem('priceCategories')||'null')||[...DEFAULT_CATS];
let itemOrders=JSON.parse(localStorage.getItem('priceItemOrders')||'{}');
let activeCat='전체',activeItem='전체',editingId=null,photoData='',currentView='prices',swReg=null;
function today(){return new Date().toISOString().slice(0,10)}
function currentMonth(){return today().slice(0,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function persist(){localStorage.setItem('priceRecords',JSON.stringify(records));localStorage.setItem('priceCategories',JSON.stringify(categories));localStorage.setItem('priceItemOrders',JSON.stringify(itemOrders));renderAll()}
function unitPrice(r){let a=+r.amount,p=+r.price;if(!a)return '';if(r.unit==='kg')a*=1000;if(r.unit==='L')a*=1000;if(r.unit==='g')return Math.round(p/a*100)+'원/100g';if(r.unit==='mL')return Math.round(p/a*100)+'원/100mL';if(['개','구','팩','봉'].includes(r.unit))return Math.round(p/a).toLocaleString()+'원/'+r.unit;return ''}
function itemListForCategory(cat){let names=[...new Set(records.filter(r=>cat==='전체'||r.category===cat).map(r=>r.item).filter(Boolean))];if(cat==='전체')return names.sort((a,b)=>a.localeCompare(b,'ko'));let order=itemOrders[cat]||[];let known=order.filter(x=>names.includes(x));let rest=names.filter(x=>!known.includes(x)).sort((a,b)=>a.localeCompare(b,'ko'));itemOrders[cat]=[...known,...rest];return itemOrders[cat]}
function filtered(){let q=$('search').value.trim().toLowerCase();return records.filter(r=>(activeCat==='전체'||r.category===activeCat)&&(activeItem==='전체'||r.item===activeItem)&&(!q||(`${r.item} ${r.name} ${r.store} ${r.category} ${r.memo||''}`).toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function setView(v){currentView=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));$('search').style.display=v==='prices'?'block':'none';$('addBtn').style.display=v==='prices'?'block':'none';if(v==='monthly')renderMonthly();if(v==='expiry')renderExpiry()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function renderPrices(){
 $('cats').innerHTML=['전체',...categories].map(c=>`<button class='chip ${c===activeCat?'active':''}' data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 $('cats').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;activeItem='전체';renderPrices()});
 const itemNames=itemListForCategory(activeCat);$('items').innerHTML=['전체',...itemNames].map(i=>`<button class='chip ${i===activeItem?'active':''}' data-item="${esc(i)}">${esc(i)}</button>`).join('');
 $('items').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{activeItem=b.dataset.item;renderPrices()});
 let f=filtered(),prices=f.map(x=>+x.price).filter(Number.isFinite),label=activeItem!=='전체'?activeItem:(activeCat!=='전체'?activeCat:'전체 기록');
 $('stats').innerHTML=`<div class='card stat'><span class='muted'>${esc(label)} 기록</span><b>${f.length}건</b></div><div class='card stat'><span class='muted'>${activeItem!=='전체'?'품목 최저가':'선택 범위 최저가'}</span><b>${prices.length?Math.min(...prices).toLocaleString()+'원':'-'}</b></div>`;
 $('list').innerHTML=f.length?f.map(r=>{let exp='';if(r.expiryNA)exp='<span class="expiryBadge">유통기한 해당없음</span>';else if(r.expiryDate)exp=`<span class="expiryBadge ${expiryClass(r.expiryDate)}">유통기한 ${esc(r.expiryDate)}</span>`;return `<article class='card'><div class='row'>${r.photo?`<img class='thumb' src='${r.photo}'>`:`<div class='thumb'></div>`}<div class='grow'><div class='muted'>${esc(r.category||'미분류')} · ${esc(r.date||'')}</div><div class='itemTitle'>${esc(r.item||'미분류')}</div><div class='product'>${esc(r.name)}</div><div class='price'>${(+r.price).toLocaleString()}원</div><div class='unit'>${r.amount?`${esc(r.amount)}${esc(r.unit)} · `:''}${esc(unitPrice(r))}</div><div class='muted'>${esc(r.store||'구매처 미입력')} · ${esc(r.channel||'')}${r.memo?' · '+esc(r.memo):''}</div>${exp}</div><div><button class='linkbtn' data-edit='${r.id}'>수정</button><button class='linkbtn danger' data-del='${r.id}'>삭제</button></div></div></article>`}).join(''):`<div class='empty'>조건에 맞는 가격 기록이 없어요.<br>‘＋ 가격 기록’을 눌러 기록해보세요.</div>`;
 $('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));$('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));renderCategorySelect();
}
function renderMonthly(){
 let m=$('monthPick').value||currentMonth(),rows=records.filter(r=>(r.date||'').startsWith(m)),total=rows.reduce((s,r)=>s+(+r.price||0),0);let by={};rows.forEach(r=>{let k=r.item||'미분류';by[k]=(by[k]||0)+(+r.price||0)});let arr=Object.entries(by).map(([item,amount])=>({item,amount,share:total?amount/total*100:0})).sort((a,b)=>b.amount-a.amount);
 $('monthSummary').innerHTML=`<div class='card metric'><span class='muted'>${esc(m)} 총 구매금액</span><strong>${total.toLocaleString()}원</strong></div><div class='card metric'><span class='muted'>구매 기록</span><strong>${rows.length}건</strong></div>`;
 $('monthCount').textContent=`${arr.length}개 품목`;
 $('monthBreakdown').innerHTML=arr.length?arr.map(x=>`<div class='breakRow'><div class='breakTop'><strong>${esc(x.item)}</strong><span>${x.amount.toLocaleString()}원 · ${x.share.toFixed(1)}%</span></div><div class='bar'><span style='width:${Math.max(1,x.share)}%'></span></div></div>`).join(''):`<div class='empty'>이 달의 구매 기록이 없어요.</div>`;
}
function dayDiff(date){let a=new Date(today()+'T00:00:00'),b=new Date(date+'T00:00:00');return Math.ceil((b-a)/86400000)}
function expiryClass(date){let d=dayDiff(date);return d<0?'urgent':d<=7?'soon':'ok'}
function expiryLabel(date){let d=dayDiff(date);if(d<0)return `${Math.abs(d)}일 지남`;if(d===0)return '오늘까지';if(d===1)return '내일까지';return `${d}일 남음`}
function expiryCard(r){return `<article class='card'><div class='row'>${r.photo?`<img class='thumb' src='${r.photo}'>`:`<div class='thumb'></div>`}<div class='grow'><div class='muted'>${esc(r.category)} · ${esc(r.item)}</div><div class='itemTitle'>${esc(r.name)}</div><div class='expiryDate'>${esc(r.expiryDate)} · ${expiryLabel(r.expiryDate)}</div><div class='muted'>구매일 ${esc(r.date||'-')} · ${esc(r.store||'구매처 미입력')}</div></div><button class='linkbtn' data-edit='${r.id}'>수정</button></div></article>`}
function renderExpiry(){
 let dated=records.filter(r=>r.expiryDate&&!r.expiryNA).sort((a,b)=>a.expiryDate.localeCompare(b.expiryDate));let expired=dated.filter(r=>dayDiff(r.expiryDate)<0),week=dated.filter(r=>dayDiff(r.expiryDate)>=0&&dayDiff(r.expiryDate)<=7),later=dated.filter(r=>dayDiff(r.expiryDate)>7);
 $('expirySummary').innerHTML=`<div class='card metric'><span class='muted'>기한 지남</span><strong>${expired.length}개</strong></div><div class='card metric'><span class='muted'>7일 이내</span><strong>${week.length}개</strong></div>`;
 let groups=[];if(expired.length)groups.push(`<div class='expiryGroup'><h3>기한 지남</h3>${expired.map(expiryCard).join('')}</div>`);if(week.length)groups.push(`<div class='expiryGroup'><h3>7일 이내 임박</h3>${week.map(expiryCard).join('')}</div>`);if(later.length)groups.push(`<div class='expiryGroup'><h3>이후 예정</h3>${later.map(expiryCard).join('')}</div>`);$('expiryList').innerHTML=groups.join('')||`<div class='empty'>등록된 유통기한이 없어요.<br>가격 기록에서 유통기한을 입력해보세요.</div>`;$('expiryList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
}
function renderAll(){renderPrices();renderMonthly();renderExpiry()}
function renderCategorySelect(){let cur=$('category').value;$('category').innerHTML=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(categories.includes(cur))$('category').value=cur}
function resetForm(){editingId=null;photoData='';$('form').reset();$('date').value=today();$('expiryDate').disabled=false;renderCategorySelect();$('formTitle').textContent='가격 기록';$('photoPreview').style.display='none';$('removePhotoBtn').style.display='none'}
function openAdd(){resetForm();$('dlg').showModal()}
function openEdit(id){let r=records.find(x=>x.id===id);if(!r)return;editingId=id;renderCategorySelect();$('category').value=r.category||'기타';$('item').value=r.item||'';$('name').value=r.name||'';$('store').value=r.store||'';$('price').value=r.price??'';$('date').value=r.date||today();$('amount').value=r.amount??'';$('unit').value=r.unit||'개';$('channel').value=r.channel||'오프라인';$('expiryDate').value=r.expiryDate||'';$('expiryNA').checked=!!r.expiryNA;$('expiryDate').disabled=!!r.expiryNA;$('memo').value=r.memo||'';photoData=r.photo||'';$('photoPreview').src=photoData;$('photoPreview').style.display=photoData?'block':'none';$('removePhotoBtn').style.display=photoData?'inline-block':'none';$('formTitle').textContent='가격 기록 수정';$('dlg').showModal()}
function del(id){if(confirm('이 기록을 삭제할까요?')){records=records.filter(x=>x.id!==id);persist()}}
$('search').addEventListener('input',renderPrices);$('addBtn').onclick=openAdd;$('closeBtn').onclick=()=>$('dlg').close();$('monthPick').value=currentMonth();$('monthPick').onchange=renderMonthly;
$('expiryNA').onchange=()=>{if($('expiryNA').checked){$('expiryDate').value='';$('expiryDate').disabled=true}else $('expiryDate').disabled=false};
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{photoData=rd.result;$('photoPreview').src=photoData;$('photoPreview').style.display='block';$('removePhotoBtn').style.display='inline-block'};rd.readAsDataURL(f)};
$('removePhotoBtn').onclick=()=>{photoData='';$('photo').value='';$('photoPreview').style.display='none';$('removePhotoBtn').style.display='none'};
$('form').onsubmit=e=>{e.preventDefault();let data={id:editingId||crypto.randomUUID(),category:$('category').value,item:$('item').value.trim(),name:$('name').value.trim(),store:$('store').value.trim(),price:+$('price').value,date:$('date').value,amount:+$('amount').value||'',unit:$('unit').value,channel:$('channel').value,expiryDate:$('expiryNA').checked?'':$('expiryDate').value,expiryNA:$('expiryNA').checked,memo:$('memo').value.trim(),photo:photoData};if(editingId){records=records.map(r=>r.id===editingId?data:r)}else records.push(data);if(!itemOrders[data.category])itemOrders[data.category]=[];if(!itemOrders[data.category].includes(data.item))itemOrders[data.category].push(data.item);persist();$('dlg').close();resetForm()};
$('backupBtn').onclick=()=>{let payload={version:3,categories,itemOrders,records};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='내가격장_전체백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(Array.isArray(d)){records=d.map(r=>({...r,item:r.item||r.name||'미분류',expiryDate:r.expiryDate||'',expiryNA:!!r.expiryNA}))}else if(d&&Array.isArray(d.records)){records=d.records.map(r=>({...r,item:r.item||r.name||'미분류',expiryDate:r.expiryDate||'',expiryNA:!!r.expiryNA}));if(Array.isArray(d.categories)&&d.categories.length)categories=d.categories;if(d.itemOrders&&typeof d.itemOrders==='object')itemOrders=d.itemOrders}else throw 0;persist();alert('전체 데이터를 복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}};rd.readAsText(f)};
function move(arr,index,dir){let j=index+dir;if(j<0||j>=arr.length)return arr;[arr[index],arr[j]]=[arr[j],arr[index]];return arr}
function renderCatManage(){$('catManageList').innerHTML=categories.map((c,i)=>`<div class='manageRow'><button class='btn mini' data-up='${i}'>▲</button><button class='btn mini' data-down='${i}'>▼</button><input value="${esc(c)}" data-catname="${esc(c)}"><button class='btn' data-rename="${esc(c)}">변경</button><button class='btn danger' data-rmcat="${esc(c)}">삭제</button></div>`).join('');$('catManageList').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{categories=move(categories,+b.dataset.up,-1);persist();renderCatManage()});$('catManageList').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{categories=move(categories,+b.dataset.down,1);persist();renderCatManage()});$('catManageList').querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let old=b.dataset.rename,row=b.closest('.manageRow'),next=row.querySelector('input').value.trim();if(!next||next===old)return;if(categories.includes(next)){alert('이미 있는 카테고리입니다.');return}categories=categories.map(c=>c===old?next:c);records=records.map(r=>r.category===old?{...r,category:next}:r);if(itemOrders[old]){itemOrders[next]=itemOrders[old];delete itemOrders[old]}if(activeCat===old)activeCat=next;persist();renderCatManage()});$('catManageList').querySelectorAll('[data-rmcat]').forEach(b=>b.onclick=()=>{let c=b.dataset.rmcat;if(c==='기타'){alert('기타 카테고리는 삭제할 수 없습니다.');return}if(confirm(`‘${c}’ 카테고리를 삭제할까요?\n해당 기록은 ‘기타’로 이동합니다.`)){categories=categories.filter(x=>x!==c);records=records.map(r=>r.category===c?{...r,category:'기타'}:r);itemOrders['기타']=[...(itemOrders['기타']||[]),...(itemOrders[c]||[])];delete itemOrders[c];if(activeCat===c)activeCat='전체';persist();renderCatManage()}})}
$('manageCatsBtn').onclick=()=>{renderCatManage();$('catDlg').showModal()};$('closeCatBtn').onclick=()=>$('catDlg').close();$('addCatBtn').onclick=()=>{let c=$('newCat').value.trim();if(!c)return;if(categories.includes(c)){alert('이미 있는 카테고리입니다.');return}categories.push(c);itemOrders[c]=[];$('newCat').value='';persist();renderCatManage()};
function renderItemOrderSelect(){let choices=categories;$('itemOrderCat').innerHTML=choices.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(activeCat!=='전체'&&categories.includes(activeCat))$('itemOrderCat').value=activeCat;renderItemManage()}
function renderItemManage(){let c=$('itemOrderCat').value;if(!c)return;let arr=itemListForCategory(c);$('itemManageList').innerHTML=arr.length?arr.map((name,i)=>`<div class='manageRow'><button class='btn mini' data-iup='${i}'>▲</button><button class='btn mini' data-idown='${i}'>▼</button><div class='grow'>${esc(name)}</div></div>`).join(''):`<div class='empty'>이 카테고리에 품목이 없어요.</div>`;$('itemManageList').querySelectorAll('[data-iup]').forEach(b=>b.onclick=()=>{itemOrders[c]=move(arr,+b.dataset.iup,-1);persist();renderItemManage()});$('itemManageList').querySelectorAll('[data-idown]').forEach(b=>b.onclick=()=>{itemOrders[c]=move(arr,+b.dataset.idown,1);persist();renderItemManage()})}
$('manageItemsBtn').onclick=()=>{renderItemOrderSelect();$('itemDlg').showModal()};$('closeItemBtn').onclick=()=>$('itemDlg').close();$('itemOrderCat').onchange=renderItemManage;
async function registerSW(){if(!('serviceWorker' in navigator))return;try{let regs=await navigator.serviceWorker.getRegistrations();for(let r of regs){if(r.active?.scriptURL&&!r.active.scriptURL.endsWith('/sw-v3.0.js'))await r.unregister()}swReg=await navigator.serviceWorker.register('./sw-v3.0.js',{scope:'./',updateViaCache:'none'});await swReg.update();navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('swReloaded30')==='1')return;sessionStorage.setItem('swReloaded30','1');location.reload()})}catch(err){console.warn('서비스워커 등록 실패',err)}}
$('updateBtn').onclick=async()=>{let b=$('updateBtn');b.textContent='업데이트 확인 중…';try{if(swReg)await swReg.update();let res=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'}),v=res.ok?(await res.json()).version:APP_VERSION;if(v!==APP_VERSION){b.textContent='새 버전 '+v+' 있음';alert('새 버전 '+v+'이 있습니다. 앱을 다시 열면 적용됩니다.')}else{b.textContent='v'+APP_VERSION+' · 최신';setTimeout(()=>b.textContent='v'+APP_VERSION+' · 업데이트 확인',1800)}}catch(e){b.textContent='v'+APP_VERSION+' · 오프라인';setTimeout(()=>b.textContent='v'+APP_VERSION+' · 업데이트 확인',1800)}};
registerSW();$('date').value=today();persist();
</script>
</body>
</html>
