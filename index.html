<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#ffffff'><link rel='manifest' href='manifest.json'><title>내가격장</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#171717;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fff;padding:18px 16px 12px;border-bottom:1px solid #eee;z-index:2}h1{font-size:22px;margin:0 0 12px}.search{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:14px;font-size:16px}main{max-width:720px;margin:auto;padding:14px 14px 100px}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap}.chip.active{border-color:#111}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0000000b}.row{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:12px;background:#eee;object-fit:cover}.grow{flex:1}.muted{color:#777;font-size:13px}.price{font-size:20px;font-weight:750}.unit{font-size:13px;margin-top:3px}.fab{position:fixed;right:20px;bottom:22px;border:0;border-radius:18px;background:#111;color:#fff;padding:15px 18px;font-size:16px;box-shadow:0 5px 20px #0003}dialog{border:0;border-radius:22px;width:min(94vw,560px);padding:0}dialog::backdrop{background:#0006}.form{padding:18px}.form h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:13px;margin:0 0 5px;color:#555}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px}.primary{background:#111;color:#fff;border-color:#111}.empty{text-align:center;padding:60px 20px;color:#777}.stats{display:flex;gap:8px;overflow:auto}.stat{min-width:140px}.stat b{display:block;font-size:18px;margin-top:4px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.linkbtn{border:0;background:transparent;text-decoration:underline;color:#555}.photoPreview{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px;display:none}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><h1>내가격장</h1><input id='search' class='search' placeholder='상품명, 구매처 검색'></header><main><div class='toolbar' id='cats'></div><section class='stats' id='stats'></section><div id='list'></div></main><button class='fab' id='addBtn'>＋ 가격 기록</button>
<dialog id='dlg'><form class='form' id='form'><div class='topline'><h2>가격 기록</h2><button type='button' class='linkbtn' id='closeBtn'>닫기</button></div><div class='grid'>
<div class='field wide'><label>상품명 *</label><input id='name' required placeholder='예: 서울우유 나100%'></div>
<div class='field'><label>카테고리</label><input id='category' list='catList' placeholder='예: 유제품·계란'><datalist id='catList'></datalist></div>
<div class='field'><label>구매처</label><input id='store' placeholder='예: 이마트'></div>
<div class='field'><label>가격(원) *</label><input id='price' type='number' min='0' required></div>
<div class='field'><label>구매일</label><input id='date' type='date'></div>
<div class='field'><label>용량/수량</label><input id='amount' type='number' min='0' step='0.01' placeholder='예: 1000'></div>
<div class='field'><label>단위</label><select id='unit'><option value='g'>g</option><option value='kg'>kg</option><option value='mL'>mL</option><option value='L'>L</option><option value='개'>개</option><option value='구'>구</option><option value='팩'>팩</option><option value='봉'>봉</option></select></div>
<div class='field'><label>구매 방식</label><select id='channel'><option>오프라인</option><option>온라인</option></select></div>
<div class='field wide'><label>사진</label><input id='photo' type='file' accept='image/*' capture='environment'><img id='photoPreview' class='photoPreview'></div>
<div class='field wide'><label>메모</label><textarea id='memo' rows='2' placeholder='행사상품, 카드할인 등'></textarea></div></div><div class='actions'><button type='button' class='btn' id='backupBtn'>백업</button><label class='btn'>복원<input id='restore' type='file' accept='application/json' hidden></label><button class='btn primary'>저장</button></div></form></dialog>
<script>
const DEFAULT_CATS=['전체','채소·과일','육류','수산물','유제품·계란','냉장·냉동','면·가공식품','조미료·소스','음료','생활용품','기타'];let records=JSON.parse(localStorage.getItem('priceRecords')||'[]');let active='전체';
const $=id=>document.getElementById(id); $('date').value=new Date().toISOString().slice(0,10);$('catList').innerHTML=DEFAULT_CATS.slice(1).map(x=>`<option value="${x}">`).join('');
function save(){localStorage.setItem('priceRecords',JSON.stringify(records));render()}
function unitPrice(r){let a=+r.amount,p=+r.price;if(!a)return '';if(r.unit==='kg')a*=1000;if(r.unit==='L')a*=1000;if(r.unit==='g')return Math.round(p/a*100)+'원/100g';if(r.unit==='mL')return Math.round(p/a*100)+'원/100mL';if(['개','구','팩','봉'].includes(r.unit))return Math.round(p/a).toLocaleString()+'원/'+r.unit;return ''}
function render(){let q=$('search').value.trim().toLowerCase();let cats=[...new Set(DEFAULT_CATS.concat(records.map(r=>r.category).filter(Boolean)))];$('cats').innerHTML=cats.map(c=>`<button class='chip ${c===active?'active':''}' onclick='active=${JSON.stringify(c)};render()'>${c}</button>`).join('');let f=records.filter(r=>(active==='전체'||r.category===active)&&(!q||(`${r.name} ${r.store} ${r.category}`).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));let prices=f.map(x=>+x.price).filter(Boolean);$('stats').innerHTML=`<div class='card stat'><span class='muted'>기록</span><b>${f.length}건</b></div><div class='card stat'><span class='muted'>최저 기록가</span><b>${prices.length?Math.min(...prices).toLocaleString()+'원':'-'}</b></div>`;$('list').innerHTML=f.length?f.map(r=>`<article class='card'><div class='row'>${r.photo?`<img class='thumb' src='${r.photo}'>`:`<div class='thumb'></div>`}<div class='grow'><div class='muted'>${r.category||'미분류'} · ${r.date||''}</div><strong>${esc(r.name)}</strong><div class='price'>${(+r.price).toLocaleString()}원</div><div class='unit'>${r.amount?`${r.amount}${r.unit} · `:''}${unitPrice(r)}</div><div class='muted'>${esc(r.store||'구매처 미입력')} · ${r.channel||''}${r.memo?' · '+esc(r.memo):''}</div></div><button class='linkbtn' onclick='del(${JSON.stringify(r.id)})'>삭제</button></div></article>`).join(''):`<div class='empty'>아직 가격 기록이 없어요.<br>아래의 ‘＋ 가격 기록’을 눌러 시작해보세요.</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function del(id){if(confirm('이 기록을 삭제할까요?')){records=records.filter(x=>x.id!==id);save()}}
$('search').addEventListener('input',render);$('addBtn').onclick=()=>{$('dlg').showModal()};$('closeBtn').onclick=()=>$('dlg').close();let photoData='';$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{photoData=rd.result;$('photoPreview').src=photoData;$('photoPreview').style.display='block'};rd.readAsDataURL(f)};
$('form').onsubmit=e=>{e.preventDefault();records.push({id:crypto.randomUUID(),name:$('name').value.trim(),category:$('category').value.trim()||'기타',store:$('store').value.trim(),price:+$('price').value,date:$('date').value,amount:+$('amount').value||'',unit:$('unit').value,channel:$('channel').value,memo:$('memo').value.trim(),photo:photoData});save();e.target.reset();$('date').value=new Date().toISOString().slice(0,10);photoData='';$('photoPreview').style.display='none';$('dlg').close()};
$('backupBtn').onclick=()=>{let b=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='내가격장_백업.json';a.click();URL.revokeObjectURL(a.href)};$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;records=d;save();alert('복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}};rd.readAsText(f)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
